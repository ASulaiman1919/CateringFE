[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/api/order-assistant"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
